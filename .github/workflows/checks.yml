name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - run: node --test gateway/test/*.test.mjs
      - run: npm ci --ignore-scripts
      - run: npm --prefix backend ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm --prefix backend audit --audit-level=moderate
      - run: npm run test:backend
      - run: npm run test:integration
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path EchoesCore
      - run: swift test --package-path EchoesCloudKit
      - run: python3 scripts/test_cloudkit_preflight.py
      - run: python3 scripts/ci-ios.py
